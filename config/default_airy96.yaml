# =============================================================================
#  速腾聚创 RoboSense Airy 96 线激光雷达配置（lightning-slam 干净工程版）
# -----------------------------------------------------------------------------
#  适用可执行：run_slam_offline / run_slam_online / run_loc_offline / run_loc_online
#  用法示例：  ./bin/run_slam_online  --config ./config/default_airy96.yaml
#              ./bin/run_loc_online   --config ./config/default_airy96.yaml
#              ./bin/run_slam_offline --config ./config/default_airy96.yaml --input_bag xxx.bag
#
#  参考来源：lidar_slam 工程 config/custom.yaml
#            （同一台 Airy 96 平台在 lidar-slam 上的实测配置）
#
#  ★本文件只列出【当前 lightning-slam 代码真正会读取】的参数；其余（pgo / ui /
#    roi.range_* / time_offset / keyframe_in_base_frame / perception 等）
#    在本工程代码里没有被读取，写了也不生效，故不写入本文件。
#    （例外：gravity_obs_* / world_frame_realign* 是"个人修改（方案C）"新增并真正读取的参数，
#      见文件后半部分"方案C：姿态/重力自检"一节。）
#    每个参数后标注了读取位置（证据：文件:行）。
#
#  ★★使用前必须核对的 5 处（详见 doc/airy96_config_guide.md 第 6 节）：
#     1) common.lidar_topic / common.imu_topic  与 Airy 驱动实际话题一致
#     2) fasterlio.extrinsic_T / extrinsic_R    与本平台雷达-IMU 安装姿态一致
#     3) roi.height_max / height_min            本工程按【雷达系 z】直接过滤
#     4) g2p5.floor_height / lidar_height       按实际安装高度填写
#     5) system.map_path                        指向建图实际保存的目录
# =============================================================================

common:
  dataset: "airy96"                         # 标识字段：当前代码未读取（话题由下面两项决定）
  lidar_topic: "/lidar/front/points_raw"    # ★点云话题（sensor_msgs/PointCloud2）
                                            #   必须与 Airy 96 驱动实际发布的话题一致（沿用 lidar_slam 平台）
                                            #   读取位置：slam.cc:88 / loc_system.cc:34 / run_slam_offline.cc:50
  livox_lidar_topic: "/livox/lidar"         # 本工程固定会订阅的 Livox CustomMsg 话题；
                                            #   不用 Livox 时保留原值即可（无该话题时不会来数据）
                                            #   读取位置：slam.cc:89 / loc_system.cc:35
  imu_topic: "/lidar/front/imu"             # ★IMU 话题（sensor_msgs/Imu）
                                            #   必须与 Airy 内置 IMU 驱动发布的话题一致（沿用 lidar_slam 平台）
                                            #   读取位置：slam.cc:87 / loc_system.cc:33 / run_slam_offline.cc:51

  # ---------------------------------------------------------------------------
  #  个人修改（2026-10-01）：【手动初始位姿 / 随时重新定位】话题（仅在线定位 run_loc_online 使用）
  #  用法：运行 run_loc_online 后，在 RViz 里用工具栏 "2D Pose Estimate" 在图上点一下车所在的位置、
  #        并拖出车头方向 —— RViz 会向下面的话题发一条 geometry_msgs/msg/PoseWithCovarianceStamped，
  #        定位模块收到后立刻以该位姿为种子【重新初始化】（相当于手动校准初始位置），
  #        日志会出现 `[manual init] ...` 与 `init with external pose: ...`。
  #   语义：默认 vehicle = 【车辆(base_link)系在地图(map)下的位姿】，这正是 RViz "2D Pose Estimate"
  #        的语义（RViz 发的是 Fixed Frame 下 base_link 的位姿）；
  #        代码内部会换算成雷达系位姿 T_map_lidar 再交给 lidar_loc
  #        （T_map_lidar = T_map_vehicle * T_vehicle_imu * T_imu_lidar，见 common/vehicle_frame.h）。
  #        若你的脚本手里已经是雷达系位姿 T_map_lidar（与 --init_pose / 地图功能点 start 同语义），
  #        把此项改为 lidar 即可，代码不再换算。
  #  前提/注意：
  #    1) RViz 的 Fixed Frame 必须是本工程的地图帧 "map"（不然点出来的坐标不在 map 下；
  #       代码检测到 frame_id != map 会打 WARNING 提示，但不会拒绝该消息）；
  #    2) 点的位置要**尽量准**（建议误差 < 1 m、车头方向与实车一致）：这不是"自动搜索"，
  #       而是"以你点的位姿为初值做一次 NDT 配准"；种子太偏会因分值不足被
  #       lidar_loc.min_init_confidence(1.8) 拒掉（日志 `init confidence too low ... reject`），
  #       此时重新点一次更准的即可，定位不会被带飞；
  #    3) 它校准的是"车现在在哪"，所以请在【车当前所在位置】点，而不是建图起点；
  #    4) 该话题不影响启动时的默认初始化（默认仍是地图 index.txt 的功能点 start）。
  #  读取位置：loc_system.cc（Init() 中，两个键用 HasValue 探测，缺键时取默认值，旧 yaml 也能跑）
  # ---------------------------------------------------------------------------
  initial_pose_topic: "/initialpose"        # 话题名；置为空串 "" 可关闭该功能
  initial_pose_frame: "vehicle"             # vehicle(默认,=RViz 语义,T_map_vehicle) | lidar(=T_map_lidar)

  # ---------------------------------------------------------------------------
  #  车体（车辆 base_link）系 ← IMU 系 的安装旋转：只影响"输出/显示"的姿态表达，
  #  不动 ESKF、不动地图、不动世界系（个人修改 方案A+，见 common/vehicle_frame.h）
  #  读取位置：laser_mapping.cc LoadParamsFromYAML() 末尾（三个键都可选，缺省=身份矩阵=不换算）
  #    vehicle_imu_mount : auto      ← 推荐。IMU 静止初始化时按重力自动定"上"，对安装倾斜自动适应
  #                        identity  : IMU 与车辆系同向（x 前、y 左、z 上），即不做换算
  #                        x_down    : Airy 标称竖装（IMU x=下, y=左, z=前）⇒ R_y(+90°)
  #                        x_up      : 竖装倒置（IMU x=上, y=左, z=后）⇒ R_y(-90°)
  #    vehicle_imu_forward_axis : auto 模式下"车头"对应 IMU 的哪个轴（x/y/z，可带负号，默认 z）
  #    vehicle_imu_R : 行主序 9 个数，直接给安装矩阵（优先级最高，可描述任意安装）
  #  ★本平台实测：标称"IMU x=下"与实车重力方向相差约 11.25°（见 doc/airy96_config_guide.md 第 11 节），
  #    故推荐 auto；若改回 x_down/不配置，车会一直带着这约 11° 的歪（但仍比加方案A之前好得多）。
  #  ★★本平台前提：IMU 在激光雷达内部（雷达怎么装 IMU 就怎么装）⇒ 这里的安装旋转与"雷达的安装姿态"
  #    是同一个未知量（只差一个单元内部固定常量 = 下面的 extrinsic_R）。因此换雷达安装姿态
  #    （水平/倾斜/倒装）时：改这里（auto 即可，连角度都不用给），**不要**去改 fasterlio.extrinsic_R/T
  #    —— 那是"雷达系↔IMU 系"的单元内部关系，同一台雷达换安装不应变化；
  #    另外记得复核 roi.height_max/min（它按【雷达系 z】过滤，垂直↔水平安装后语义会翻转）。
  # ---------------------------------------------------------------------------
  vehicle_imu_mount: auto                   # ★车体安装姿态：auto=按重力自动对齐（推荐）
  vehicle_imu_forward_axis: z               # ★车头方向 = IMU 的 +z 轴（Airy 竖装平台实测）
  # vehicle_imu_R: [ 0, 0, 1, 0, 1, 0, -1, 0, 0 ]   # 需要完全手动指定时（= x_down 的矩阵）打开此项

# -----------------------------------------------------------------------------
#  fasterlio：前端 LIO（ESKF + iVox）参数 —— Airy 96 核心适配段
#  读取位置：src/core/lio/laser_mapping.cc:46-85
#  ★该段代码用 yaml[...][...].as<>() 强转，任何一个键缺失都会抛 "bad conversion"
#    ⇒ 日志打印 "failed to init lio"，节点起不来。因此本段每一个键都必须保留。
# -----------------------------------------------------------------------------
fasterlio:

  # ---- 雷达类型与型号 ----
  lidar_type: 4                 # ★4 = RoboSense（走 RoboSenseHandler）
                                #   1=Livox(AVIA) 2=Velodyne 3=Ouster，见 laser_mapping.cc:93-107
                                #   点云解析见 pointcloud_preprocess.cc:134-172（RoboSenseHandler）：
                                #   取 x,y,z (float32) + intensity (float32) + timestamp (double, 秒)，
                                #   点类型 PointRobotSense 定义在 point_def.h:27-37（不含 ring）
                                #   ⇒ 驱动点云必须带 timestamp 字段，否则去畸变时间戳匹配不上
  scan_line: 96                 # Airy 96 线
  blind: 0.1                    # 盲区(m)：距离小于该值的点丢弃（range < blind^2）
  time_scale: 1e-3              # 仅 Velodyne(lidar_type=2) 使用；RoboSense 用点云自带时间戳（秒），本项不生效

  # ---- 点云处理 ----
  skip_lidar_num: 0             # 跳帧：0=每帧都处理（>0 时每 N 帧处理一帧，用于降负载）
  point_filter_num: 1           # 抽稀倍数：Airy 96 点云很密（单帧可达数十万点），
                                #   CPU 吃紧时可改为 2~4（沿用 lidar_slam 实测取 1，精度优先）
  max_iteration: 4              # ESKF 最大迭代次数
  filter_size_scan: 0.2         # 当前帧降采样体素(m)：96 线取小值以提高精度（lidar_slam Airy 实测值）
  filter_size_map: 0.2          # 局部地图（iVox）体素分辨率(m)

  ivox_grid_resolution: 0.2     # iVox 栅格分辨率(m)
  ivox_nearby_type: 18          # iVox 邻域类型：6 / 18 / 26
  esti_plane_threshold: 0.3     # 平面拟合阈值(m)（Airy 实测；原默认 0.1）

  use_aa: false                 # Anderson 加速

  # ---- IMU 噪声 ----
  # 说明（lidar_slam 实测结论）：由 1e-4 放大到 1e-2 后，走廊两端掉头处的往返重访误差明显下降；
  # 原值过小 = 过度信任 IMU 短时预测。若发现轨迹抖动，可在 1e-3~1e-2 之间回调。
  acc_cov: 0.01                 # 加速度计测量噪声
  gyr_cov: 0.01                 # 陀螺仪测量噪声
  b_acc_cov: 0.0005             # 加速度计零偏随机游走
  # ---- ★陀螺零偏随机游走：5e-4 → 1e-8（2026-10-02 第4次修复②）----
  #   为什么必须改（本平台 val bag 实测证据）：
  #     ① 陀螺零偏在【静止窗口】里是稳定的：起步窗口与末尾窗口都测得 bg_z = -0.04157 rad/s
  #        （= 2.39°/s，方向正好是 IMU z 轴；本平台 IMU z = 车体前进方向 ⇒ 这恰好是 roll 轴）；
  #     ② 原值 5e-4 允许 ESKF 在【行驶中】继续随机游走这个零偏：本 bag 的 LIO roll 从 0 漂到 +18.97°
  #        （中位数 +7.2°），而同一段陀螺积分证明车体只动了 ≤0.79°；漂移速率与 bg_z 完全同量级
  #        （0.04157 rad/s × ~8 s ≈ 19.1°）⇒ 现象就是"零偏被重新注入姿态"；
  #     ③ 改到 1e-8 后，27 s 内零偏随机游走的标准差 ≈ sqrt(1e-8 × 27) ≈ 5e-4 rad/s ≈ 0.03°/s
  #        ⇒ 等价于"把启动静止窗口测出的零偏锁定"（配合同一批修改里的"行驶中竖直锚"，姿态不再被拧）。
  #   ★若换 IMU / 换温度环境，或长时间（>10 min）运行后出现固定方向的姿态漂移，可回调到 1e-7~1e-6；
  #     复核方法：日志 "LIO state(vehicle/base_link)" 行末尾新增的 bg 应全程基本恒定（验收项）。
  b_gyr_cov: 0.00000001         # 陀螺仪零偏随机游走（1e-8：锁定启动测得的零偏，见上方说明）
  # ---- 雷达-IMU 外参（lidar → IMU，即 p_imu = R * p_lidar + t）----
  # 代码链路：laser_mapping.cc:125-126 读入 offset_R_lidar_fixed_/offset_t_lidar_fixed_
  #           → p_imu_->SetExtrinsic() → imu_processing.hpp:112 的 R_lidar_imu_/t_lidar_mu_
  # 读取位置：laser_mapping.cc:62-63
  # ★★本组数值沿用 lidar_slam 的 Airy 96 平台（雷达【垂直安装】：雷达 z=车体前进方向、y=上，
  #    IMU 竖装；见 lidar_slam/doc/framework_and_extrinsics_guide.md 第 3 节实测 T_imu_lidar）。
  #    逐轴自洽：R_z(+90°) 把 lidar y(=上) → IMU -x ⇒ IMU x=下；lidar z(=前) → IMU z ⇒ IMU z=前，
  #    与上面 common.vehicle_imu_forward_axis: z 一致；extrinsic_T≈0 也印证 IMU 在雷达内部、相位中心重合。
  #  ★★本平台 IMU 内置在雷达里（同一个刚体）⇒ 本组外参是"雷达系↔IMU 系"的【单元内部】固定关系：
  #    同一台雷达换安装姿态（水平/倾斜/倒装）时，这里【不应改变】；
  #    安装姿态变化体现在 common.vehicle_imu_mount（auto 自动适应），并需复核 roi.height_max/min。
  #    只有当"换了另一台雷达"或"IMU 与雷达不是同一个刚体"时，才需要重新标定本组外参；
  #    若历史上曾用它去"凑"安装倾角，则该值已被污染，应重新按单元内部关系标定。
  #    另注：本工程没有 lidar_slam 的“从 TF base_link→laser_points_front 自动注入外参”机制，
  #    这里写什么就是什么，务必与实车（单元内部）一致。
  extrinsic_T: [ 0, 0, 0.004 ]
  # ---- ★★2026-10-02 第5次修复：【外参 up 方向】按【实测路面法向】重标定（更正第4次修复的参照错误）----
  #   【第4次修复错在哪】它把"雷达 +y"当成竖直（即令 R·(0,1,0) = 加计竖直 a0）。但本平台雷达单元
  #     相对重力是【倾斜安装】的：雷达 +y 与【实测路面法向】差 10.590°（实测，见下）⇒ 这个式子
  #     等价于把"路面"拧了 10.59° ⇒ 地图的地面和墙【整体刚性】倾斜 ~10.6°（墙同样偏 10.4~11.2°，
  #     只有与旋转轴平行的墙保持竖直，实测 0.15°/0.22°）⇒ z 沿前进方向按 tan(10.6°)=0.187 m/m 漂移。
  #   【正确的标定方程（只用两个"实测物理量"，与安装姿态无关）】
  #         R · n_l = a0
  #     n_l = 雷达系里的【实测】路面法向 = [ 0.04374724, 0.98296706, 0.17849914 ]
  #           （来自 global.pcd 最大地面平面：6565 点、rms 1.7 cm、倾角 10.602°、方位 17.5°，
  #             用 index.txt 起始位姿反解回雷达系；它与雷达 +y 夹角 = 10.590°）
  #     a0  = IMU 系里的【实测】静止比力方向（= 竖直向上）= [ -0.98049272, -0.04813205, -0.19057105 ]
  #   【实测残差 angle(R·n_l, a0)】名义旧值 = 21.93°（对上"改前 0.42 m/m≈22.8°"）；第4次修复值
  #     = 10.59°（对上本次 val_4th_b 实测地面倾角 10.60°）；本次修正值 = 0.007°。
  #   【本次数值怎么来的】R_new = R_第4次修复值 · D，D = 绕雷达系轴 [-0.97126, 0, 0.23804] 转 10.5900°
  #     （把 n_l 旋到 +y 的最小旋转）⇒ R_new·n_l = R_旧·(0,1,0) = a0 ✓
  #     校验：det = 1、|R·Rᵀ − I| = 1.0e-8。
  #   【★注意】R·(0,1,0) 与 a0 仍差 10.59° —— 这是【雷达单元相对重力的安装倾角】，属正常现象，
  #     不是错误：不要再按 (0,1,0) 去"修"外参（那正是第4次修复把地图拧歪 10.6° 的原因）。
  #   【★影响】改后世界系/地图整体回正 ~10.6° ⇒ index.txt 的 start 功能点、以及所有已建地图都换了
  #     基准 ⇒ **必须用同一 bag 重建地图**；roi.height_* 按雷达系 z 定义，不受影响。
  #   【复核】重跑后启动日志应打印【外参 up 方向自检(路面法向参照)】相差 ≤0.4°；再用
  #     scripts/pose_gravity_zdrift_check/ 量"地图地面倾角"（期望 ≈0，改前 10.6°）。
  # ---------------------------------------------------------------------------
  # ----【以下"第4次修复③"是历史记录，其结论已被上面的第5次修复更正】----
  # ---- ★★2026-10-02 第4次修复③：按"单元内部真实关系"重标定（原值把 IMU 的竖直方向装错了 11.33°）----
  #   【实测证据】同一个 val bag，两条互相独立的测量（都不依赖任何外参假设）：
  #     ★【第5次修复更正】①这一条实测结论不成立（选面/参照方法有偏，与三条独立证据矛盾）：
  #       用 global.pcd 的全局地面平面 + index.txt 起始位姿反解回雷达系，雷达 +y 与实测路面法向
  #       差 10.590°；② 的 11.33° 是【单元相对重力的安装倾角】（正常现象），不是外参写错。
  #       证据：a) 4 次修复后 val_4th_b 地图地面倾角实测 10.602°（= R·n_l 与加计竖直的残差 10.59°）；
  #             b) 改前(名义外参)实测 0.42 m/m ≈ 22.8°，与 angle(R_名义·n_l, a0) = 21.93° 相符；
  #             c) 地图里地面与 5 面墙【整体刚性】倾斜 10.4~11.2°，仅与旋转轴平行的墙保持竖直(0.15°/0.22°)。
  #        ⇒ "雷达 +y 就是竖直向上"（纯几何，与外参/IMU 无关）；
  #     ② IMU 静止窗口（118 个采样）的平均比力方向（IMU 系）= (-0.98413, -0.0483106, -0.191278)
  #        （|a| = 1.00371 g）⇒ 归一化后与"IMU -x"相差 11.3356°，并不是 0
  #        ⇒ 这台 Airy 单元内部，IMU 的 x 轴并不水平朝下，而是偏了 11.33°（单元内部安装/标定关系）。
  #   【后果】原 extrinsic_R 声称"雷达 +y(上) → IMU -x"，与实际差 11.33° ⇒ "雷达看到的地面"比
  #     "世界系 z（由加计重力定义）"倾斜 11.33° ⇒ 地图地面倾斜、z 沿前进方向按 tan(11.33°)=0.20 m/m 漂移。
  #   【怎么算的】R_new = T · R_old，其中 T = 把 R_old·(0,1,0) 旋到"实测竖直方向"的【最小旋转】
  #     （轴 = ((-1,0,0) × up_meas) 归一化 = (0, -0.96958, 0.24489)，角 = 11.3356°）。
  #     这样只修正"竖直方向"，雷达左右/前进关系（lidar x→IMU y、lidar z→IMU z）保持不动（最小改动）。
  #     校验：det(R_new) = 1、正交误差 7e-9、R_new·(0,1,0) 与实测竖直方向夹角 0.005°。
  #   【如何复核】重跑后启动日志应打印（新增的自检，见 laser_mapping.cc 第4次修复③）：
  #         [方案C]【外参 up 方向自检】通过：... 相差 0.x deg（≤ 0.4°）
  #     并可用 scripts/pose_gravity_zdrift_check/ 里的脚本量"地图地面倾角"（期望 ≈0）。
  #   【★影响范围】本组是"雷达系↔IMU 系"的【单元内部】关系（同一台 Airy 里二者是刚体）：
  #     · 与雷达的安装姿态无关（水平/倾斜/倒装都体现在 common.vehicle_imu_mount: auto，本文件不变）；
  #     · 但改后【世界系/车辆系会整体旋转 ~11.3°】⇒ 已建好的地图、index.txt 里的 start 功能点与
  #       新外参不是同一个基准 ⇒ **必须重建地图**（本平台地图本来也因倾斜问题要重建）。
  #   【★何时需要重新标定】换另一台 Airy、或 IMU 与雷达不再是同一个刚体时，必须重测上面两条，
  #     不要照抄本组数值。
  # extrinsic_R: [ -0.09022899, -0.92766963, -0.36233655,
  #                 0.99577883, -0.09018158, -0.01708193,
  #                -0.01682970, -0.36234836,  0.93189078 ]
  extrinsic_R: [ 0, -1, 0,
                 1,  0, 0,
                 0,  0, 1 ]
  # ---- ★(第5次修复新增，可选键) 雷达系下的【实测路面法向】：up 自检的参照向量 ----
  #   读取位置：laser_mapping.cc LoadParamsFromYAML（缺省 [0,1,0] ⇒ 退回旧行为/旧告警语义）
  #   含义：本平台雷达相对重力倾斜安装，+y 不是竖直；自检必须用这个实测法向，才等价于"地图地面水平"。
  #   换雷达 / 换安装 / 重新标定外参后必须重测本项（方法：global.pcd 的地面平面 + index.txt 起始位姿反解）。
  ground_normal_lidar: [ 0.04374724, 0.98296706, 0.17849914 ]
  # 旧值（名义值 [0,-1,0,1,0,0,0,0,1]，仅作历史对照。★不要回退到它：实测它会让地图地面倾斜 21.93°）；它对应"雷达 +y → IMU -x"的近似关系，实测差 11.33°）：
  # extrinsic_R: [ 0, -1, 0,
  #                1,  0, 0,
  #                0,  0, 1 ]
  #  ★★数值写法提示（2026-10-02 第 4 次修复踩到的坑）★★
  #    这样写出来的矩阵一定**不是严格正交**的（本组实测 |R·Rᵀ − I| = 7.0e-9），而 Sophus 的
  #    SO3(Matrix) 构造带 isOrthogonal() 前置检查（阈值 ~1e-10，Frobenius 范数），
  #    超限就 SOPHUS_ENSURE 直接 abort（现象：启动即 `R is not orthogonal:` 后进程中止）。
  #    ⇒ 现在读取处已统一正交化（math::OrthonormalizeRotation()，见 lightning_math.hpp 注释，
  #      在 laser_mapping.cc / localization.cpp / g2p5.cc 三处外参入口），因此本键**可以**按小数写；
  #      但仍建议：能用 0/±1 的轴对齐关系就别写小数（可读且无误差）。

  # ---- ESKF 初始化与关键帧 ----
  keep_first_imu_estimation: true   # true=保留首个 IMU 估计（Airy 实测；默认配置为 false）
  kf_dis_th: 0.5                    # 关键帧距离阈值(m)（Airy 实测；默认配置为 1.0）
  kf_angle_th: 10.0                 # 关键帧角度阈值(度)
  enable_icp_part: true             # 是否叠加 ICP 点面约束
  plane_icp_weight: 700.0           # ICP 点面权重（lidar_slam Airy 实测值）
  min_pts: 50                       # 参与配准的最少点数（Airy 实测；默认配置为 300~500）
  imu_filter: false                 # 是否启用 IMU 平均滤波（ESKF 已处理噪声，一般无需开）
  proj_kfs: false                   # 是否把历史关键帧投影进局部地图

  # ===========================================================================
  #  个人修改（2026-10-02，方案C：姿态/重力根治）—— 以下全部是【可选键】，
  #  不写也能跑（用代码默认值，见 laser_mapping.cc LoadParamsFromYAML 与 imu_processing.hpp）。
  #  背景：诊断中"轨迹整体刚性倾斜 24.32° / 地图地面 3.7 m 内下降 1.12 m ≈ 22°"曾在
  #        2026-10-01 被判定为"世界系倾斜 bug"。2026-10-02 用【不含 LiDAR 的纯 IMU 复核】
  #        （scripts/… 见 doc/pose_gravity_zdrift_fix_report.md 第 6 节）得到新结论：
  #          · 陀螺积分 + 加计方向在 27 s 内保持竖直在 ~1° 内（窗口均值），加计零偏/刻度一致
  #            ⇒ IMU 内部自洽，世界系本身没有 20° 级静态倾斜；
  #          · 该 bag 的关键帧轨迹精确落在一个【倾角 ~20° 的平面】上（拟合 rms 6~10 mm/8.7 m），
  #            且 IMU 高度相对局部地面恒定（0.745~0.836 m）⇒ 车确实行驶在【真实坡道】上
  #            （本平台 g2p5 注释也写明"路线含坡道/匝道"，esti_floor 因此被关掉）。
  #        ⇒ 因此本组参数的作用是【把绝对竖直参考补上并自检】，而不是"修 24° 倾斜"：
  #          真实坡道不需要被"扶正"，而一旦世界系真的歪了（上车即动、几何退化段被拖歪），
  #          下面三级防线会在日志里报出来并自动/人工纠正。判读方法：
  #            [方案C][self-check] 世界系与重力夹角（只取准静态窗口，动态窗口会跳过）
  #            + [方案C] gravity obs: d_rot  （每帧实际修正量）
  #          详见 doc/pose_gravity_zdrift_fix_report.md
  # ---------------------------------------------------------------------------
  #  ① IMU 静止初始化窗口判据（解决"上车即开动 ⇒ 重力对齐被污染"）
  #     原实现只看采样数（20 个采样 ≈ 0.1~0.2 s）就完成初始化，这 0.1~0.2 s 内若有
  #     加减速/转弯，mean_acc 里就混入运动加速度，对齐出的"竖直"会歪十几度甚至二十几度。
  #     现在改为：窗口足够长【且】判为静止才完成初始化；超时（默认 5 s）则带错误日志强制完成，
  #     并转由运行期的重力观测 + 世界系再对齐兜底。
  #  ② 重力（竖直）姿态观测：低动态时把"加计方向 = 竖直向上"作为姿态【软观测】并入 ESKF，
  #     权重 = 1/σ²（默认 1.5°），远弱于 LiDAR（约 3 个数量级），只在 LiDAR 约束不到的
  #     方向上做慢修正 ⇒ 姿态永远有一个绝对竖直参考，不会再被拖歪。
  #     ★若世界系/地图是倾斜的（例如用旧地图跑定位），这个观测会与倾斜的参考冲突；
  #       定位端（run_loc_*）的 LIO 世界系只是里程计基准，可把 gravity_obs_enable 设 false。
  #  ③ 世界系重力再对齐：万一世界系已经歪了，在建图早期（默认前 40 个关键帧 / 15 s 内）
  #     把位姿 + 关键帧 + 局部地图整体【刚性旋转】回竖直（只换基准、不改几何形状），
  #     并回调让 g2p5 重绘 2.5D 栅格图。倾角 > world_frame_realign_max_deg 时只告警不自动旋转
  #     （那种情况通常意味着数据本身有问题，自动旋转会掩盖故障）。
  # ===========================================================================
  imu_init_acc_tol: 0.15            # 静止判据：| |a| - g | 上限（m/s²；0.15 ≈ 1.5 m/s² 的等效水平加速度）
  imu_init_gyr_tol: 0.10            # 静止判据：窗口内平均角速度上限（rad/s；0.10 ≈ 5.7°/s）
  imu_init_acc_std_rel_tol: 0.05    # 静止判据：比力抖动（相对均值，无量纲）上限
  imu_init_min_duration_s: 0.5      # 认为"窗口够长"的最短时长（s）
  imu_init_max_duration_s: 5.0      # 等待静止的最长时长（s；超时后强制完成并打错误日志）
  imu_init_max_wait_count: 100      # 等待静止的最大采样数（与上一项取先到者）

  gravity_obs_enable: true          # 是否启用重力/竖直姿态软观测
  gravity_obs_sigma_deg: 1.5        # 观测噪声(度)：越小姿态被拉得越紧（建议 1.0~3.0）
  gravity_obs_acc_tol: 0.15         # 低动态门限：| |a|/g - 1 | 需小于该值（0.15 ⇒ 1.5 m/s²）
  gravity_obs_gyr_tol: 0.15         # 低动态门限：|ω| 需小于该值（rad/s，≈8.6°/s）
  gravity_obs_acc_dir_tol_deg: 3.0  # ★低动态门限（关键）：窗口内【比力方向相对窗口均值的最大夹角】上限(度)。
                                    #   为什么必须要有它：转弯/过坎这类【横向加速度】会让 |a| 只变 0.3 m/s²
                                    #   （幅值判据放过），但方向偏离竖直可达 10~15°
                                    #   （本 bag 实测 15.33° @|a|=8.68，横向仅 1.13 m/s²）——
                                    #   若只看幅值，就会把这个"假重力"喂给姿态观测/自检，把车体姿态也带歪。
                                    #   3.0° 对应约 0.5 m/s² 的平动冲击，正常直线行驶远小于它。
                                    #   ★但实测行驶中它几乎恒被撞穿（本 bag 3.20°）⇒ 行驶中改用
                                    #     gravity_obs_motion_acc_dir_tol_deg（见下方"行驶中的竖直锚"），
                                    #     本项只在【准静止】时生效。
                                    #   设为很大（如 180）可关闭该项，退回"只看幅值+角速度"的行为。
  gravity_obs_ba_warn_deg: 2.0      # ★ba 一致性告警阈值(度)。
                                    #   自检/世界系再对齐的判据用【未扣 ba 的原始比力方向】
                                    #   （准静态窗口里 |a|≈g ⇒ 它本身就等于重力方向，与 ba 无关），
                                    #   而不是 (a - ba)：ESKF 的加计零偏 ba 会被机动"拽"到
                                    #   |ba|≈1.2 m/s²(≈7°，本 bag 实测) 且观测性差、几乎不回弹，
                                    #   于是 (a-ba) 方向偏 7°，会让自检读出 4.9~12.9° 的"世界系歪了"
                                    #   假警报（同一时刻地图地面倾角 21.05° vs 物理实测 22.77°，
                                    #   世界系其实只歪 ~1.7°）；更危险的是世界系再对齐也拿它当依据，
                                    #   本 bag 差 1.6 ms 就会把地图整体旋转 12.9°。
                                    #   超过本阈值时日志打印"带 ba 的同项 = X deg"的 WARNING，
                                    #   提醒该数字来自 ba 污染、不可当世界系倾斜用。
  gravity_obs_motion_acc_tol: 0.35  # ★平动加速度门限(m/s²)。由【LIO 世界系速度差分】估计（与加计零偏无关）。
                                    #   加计测的是比力 = 重力 + 平动加速度 ⇒【恒定的加/减速】会做出一个
                                    #   15° 级的"假重力"方向，而加计自己的三个门限(acc_tol / gyr_tol /
                                    #   acc_dir_tol)全都看不出来：① 沿 22° 坡道以 2.6 m/s² 加速时 |a| 只变
                                    #   ~3.5%(acc_tol 0.15 放过)；② 平稳加减速时 |ω| 很小(0.15 rad/s 放过)；
                                    #   ③ 加速度恒定时窗口内比力方向散布≈0(3° 放过)。
                                    #   本 bag 实测：真正静止时(ba≈0)自检读数 0.26°，而同一次运行里车辆
                                    #   加速的那一瞬间同一个自检读到 15.58° —— 差 60 倍，必须剔掉。
                                    #   世界系再对齐会按累积值【刚性旋转整张地图】，一旦吃到这种样本
                                    #   就会把好地图整体转歪 15°(上一轮差 1.6 ms 就会按 12.9° 转)，
                                    #   所以本判据在"再对齐累积"里必须最严格。
                                    #   0.35 m/s² ≈ 2° 的比力方向误差；设成很大(如 100)可关闭本判据。
  gravity_obs_motion_window_s: 1.0  # 速度差分基线(s)：太短会被速度噪声淹没，太长会跨过机动，默认 1.0
  gravity_obs_max_speed_mps: 0.05   # ★"世界系再对齐"的静止门限(m/s)：只采信【车确实停着】的重力样本。
                                    #   为什么还需要它(第五个也是最后一个漏洞)：平动加速度门限挡的是
                                    #   "持续的加/减速"，而【运动中过坎/坑、车身瞬时冲击】这类样本
                                    #   ① 1 s 平均 |Δv| 可能很小(先加后减、净变化≈0)、② |ω| 小、
                                    #   ③ 窗口内方向散布小 ⇒ 能同时骗过 acc_tol / gyr_tol /
                                    #   acc_dir_tol / motion_acc_tol（本 bag 实测确有一个 15.58° 的样本
                                    #   通过了全部四项，而同一 bag 真静止时读数只有 0.26°）。
                                    #   再对齐会【刚性旋转整张地图】⇒ 判定必须用"车真停着、比力就是
                                    #   重力"的铁样本；每个建图任务起步段本就有静止样本，够用。
                                    #   速度取 LIO 世界系速度(与加计无关)；设成很大(如 100)可关闭本判据。
  gravity_obs_every_n_scan: 1       # 每 N 个 scan 施加一次（1 = 每帧）
  gravity_obs_sigma_scale: 1.0      # 权重整体缩放（调试用）
  gravity_obs_prior_inflation_deg: 0.5
                                    # ★施加重力观测前给姿态协方差充气的标准差(度)。
                                    #   必须非 0：LiDAR 每帧把姿态协方差压到 ~0.03°，不充气的话
                                    #   1.5° 的软观测增益只有 ~1e-4（= 完全不起作用，实测 d_rot 仅 1e-4 度）。
                                    #   0.5° ⇒ 每帧修正当前偏差约 10%（时间常数 ~1 s）。

  # ---- 【行驶中的竖直锚】（2026-10-02 第4次修复①：本次 roll 漂移 / z 漂移的根治点）----
  #   问题（本 bag 实测）：原重力观测在【车一动】时就几乎恒被"窗口比力方向散布 ≤ 3°"挡掉
  #     （日志 `gravity obs skipped (dynamic): ... 方向散布 = 3.20 deg`）⇒ ESKF 里 valid_=false 会把这次
  #     更新整体回滚（日志表现为 `d_rot = 0 deg` 而同一时刻"世界系夹角(无ba) = 4.77°"）
  #     ⇒ 行驶全程姿态没有绝对竖直参考 ⇒ 陀螺零偏把 roll 一路积到 +18.97°（车体实际 ≤0.79°）
  #     ⇒ 世界系倾斜 ⇒ z 沿路径下弓 1.37 m，停车后重力观测重新生效又把它拉回 0.026 m。
  #   修复：行驶中改用"能证明此刻比力 ≈ 纯重力"的四项判据（下面三项 + 上面的 acc_tol/gyr_tol），
  #         并给一个更软的 σ 做"慢拉"（不与 LiDAR 抢主导权）。
  #   ★与"世界系再对齐"的区别：这里只是【姿态软观测】（每帧 ~3% 的慢修正），
  #     不会像再对齐那样刚性旋转整张地图 ⇒ 门限可以比再对齐宽松。
  gravity_obs_motion_enable: true           # 总开关（false = 退回"只在准静止时施加"的旧行为）
  gravity_obs_motion_sigma_deg: 3.0         # 行驶中的观测噪声(度)：越大越软（准静止仍用 1.5°）
                                            #   单帧增益 ≈ 0.5²/(0.5²+σ²) ⇒ σ=3° 时 ~2.7%、时间常数 ~4 s
  gravity_obs_motion_acc_dir_tol_deg: 10.0  # 行驶中"窗口比力方向散布"门限(度)。
                                            #   3° 时几乎恒被挡掉（实测 3.20°）；散布来自路面振动，是
                                            #   【随机】的 ⇒ 窗口均值误差 ≪ 散布本身；"系统性假重力"
                                            #   （持续加/减速）由 gravity_obs_motion_acc_tol 负责挡。
  gravity_obs_motion_min_speed_mps: 0.1     # 判定"在动"的 LIO 速度门限(m/s)：|v| 大于它才走"行驶中"这套
                                            #   更松的门限；否则沿用准静止的严格门限。

  world_frame_realign: true         # 是否允许"世界系重力再对齐"（建图模式、且必须在地图早期）
  world_frame_realign_min_deg: 0.7  # 小于该倾角不做（避免无谓的整体旋转）
  world_frame_realign_max_deg: 30.0 # 大于该倾角【不自动旋转】，只打 ERROR 提示排查
  world_frame_realign_max_kf: 40    # 只允许最初这么多个关键帧以内做（超出后只告警）
  world_frame_realign_max_time_s: 15.0  # 只允许建图开始后这么久以内做
  world_frame_realign_min_samples: 20   # 至少累积这么多个低动态重力样本才敢动

# -----------------------------------------------------------------------------
#  roi：高度 ROI（前端与定位端都会使用）
#  读取位置：laser_mapping.cc:72-73（前端）、localization.cpp:115-116（定位端）
#  ★重要：本工程直接拿【雷达系 z】与 height_min/height_max 比较，没有 lidar_slam 的
#    FilterUp（先变换到“上向参考系”再取上向分量）机制。
#    · 雷达【水平安装】时，height 就是真实高度 ⇒ 取 60.0 / -1.0 合理；
#    · 雷达【垂直安装】（雷达 z=前进方向）时，这里实际裁掉的是【前向距离】，
#      取值含义随之改变，需按实车确认（lidar_slam 用同一组 60/-1）。
# -----------------------------------------------------------------------------
roi:
  height_max: 60.0              # 高度 ROI 上限(m)
  height_min: -1.0              # 高度 ROI 下限(m)：取负值以保留地面点

# -----------------------------------------------------------------------------
#  g2p5：2.5D 栅格地图（导航用）
#  读取位置：src/core/g2p5/g2p5.cc:486-491
# -----------------------------------------------------------------------------
g2p5:
  esti_floor: false             # 是否动态估计地面
                                #   ★本平台雷达离地约 1.8 m 且路线含坡道/匝道；动态拟合要求
                                #     "地面法向 ≈ +z"(>0.99)，坡道段会被判"地面不水平"而回退，
                                #     所以建议直接写死下面的数值
  lidar_height: 0.46            # 换算后工作坐标系原点离地高度(m)
                                #   ★严格含义：g2p5 的坐标换算只换【朝向】、不搬原点，换算后点云的
                                #     原点 = 【IMU 原点】⇒ 本项本质是"IMU 离地高度"。
                                #     本平台 IMU 内置在雷达内（extrinsic_T≈4mm）⇒ 与雷达离地高度等同；
                                #     实测中位 1.812 m(5%~95%: 1.62~2.16)，见
                                #     scripts/global_map_fix_check/gs_ground_height.py
                                #   ★若将来 IMU 与雷达分离（外参平移不可忽略），必须改按【IMU 高度】填
  floor_height: -0.46           # 地面在【换算后工作坐标系】中的 z，= -lidar_height
                                #   ★★2026-10-01 g2p5 坐标系补丁后语义回归标准含义：g2p5 内部先把
                                #     【雷达系】点云换算到【车辆(base_link)系】(z 向上，IMU 在原点)，
                                #     地面因此在原点下方 h 处 ⇒ 这里填 -h。
                                #     ★这是"三段坐标系"里的第二段：雷达系→IMU 系 由
                                #     fasterlio.extrinsic_R/T 描述（单元内部固定关系），IMU 系→车辆系
                                #     由 common.vehicle_imu_* 描述（安装姿态，auto 时运行期按重力求解）。
                                #     两段各自独立、互不代偿，切勿用其中一段去凑另一段。
                                #     旧的 0.0/0.0 是"点云坐标系搞错(把雷达系 z 当前向)"时代的凑数值，
                                #     会让栅格图的切层整体偏高、障碍覆盖率明显偏低（详见
                                #     doc/global_map_extrinsic_fix_report.md 第 10.4 节）。
  min_th_floor: 0.2             # 高于地面该高度的障碍物才写入栅格（下限）
  max_th_floor: 0.3             # 高于地面该高度的障碍物才写入栅格（上限）
  grid_map_resolution: 0.05     # 栅格分辨率(m)：室内 0.05，室外 0.1~0.2

# -----------------------------------------------------------------------------
#  system：系统开关与路径
#  读取位置：slam.cc:36-40（开关）、loc_system.cc:42（map_path）、localization.cpp:64-68
#            loc_system.cc（publish_map 可选键，仅 run_loc_online 生效）
#            loc_system.cc（tf 可选键，仅 run_loc_online 生效）
# -----------------------------------------------------------------------------
system:
  with_loop_closing: false       # 是否启用回环检测
  with_ui: true                 # ★是否启用 3D UI(Pangolin)：true 才会创建可视化窗口
                                #   （slam.cc:33 读入 → slam.cc:46-52 创建 PangolinWindow）
                                #   注意：窗口只是显示容器，要有雷达/IMU 数据进来才会画出轨迹与点云
                                #   远程/无 X 显示（无 DISPLAY）的环境请改回 false
  with_2dui: false              # 是否启用 2D UI(OpenCV 弹窗)：需要 with_g2p5=true，且要有显示环境
  with_g2p5: true               # 是否生成 2.5D 栅格地图
  step_on_kf: false             # 是否在关键帧处暂停（调试用）

  # ---- 栅格地图话题发布（个人修改 2026-10-01）-----------------------------------
  #  把【已保存的栅格地图】以 nav_msgs/OccupancyGrid【按固定间隔持续】发布，供下游规划/控制使用。
  #  适用入口：run_loc_online（在线定位进程 —— 它是长期运行的，正好当地图服务器）。
  #  ★建图端 run_slam_online 不发布本话题（只把地图存盘），
  #    定位端发布的就是定位正在用的同一份 <map_path>/map.pgm + map.yaml，两者同源。
  #  读取位置：loc_system.cc Init()；整段都是【可选键】（删掉也能跑，用代码默认值）。
  publish_map:
    enable: true                  # ★总开关：false => 不发布、也不建发布线程
    topic: "/localization/map"    # ★话题名（下游订阅这个）
    interval: 2.0                 # ★发布间隔(秒)；每帧都是完整地图，默认 1 Hz
                                  #   （地图 1.2 万格×百行量级时约 1 MB/帧、1 MB/s 带宽；调大可降带宽）
    path: ""                      # 栅格地图目录（含 map.pgm / map.yaml）；
                                  # 留空 => 用下面的 system.map_path（推荐留空，两者必然一致）
    frame_id: "map"               # 消息 header.frame_id；本工程 SLAM/定位的世界系就是 map
                                  # 数据源固定为 map.pgm/map.yaml（map_server 格式），
                                  # 文件更新后（重新建图并保存）会自动重载并改发新图，无需重启

  # ---- 定位端 TF 发布（个人修改 2026-10-01）-------------------------------------
  #  适用入口：run_loc_online（读 loc_system.cc 的 PublishTf / StartTfListener）
  #  【为什么要改】车上原有的 TF 树是（本平台实测，见 rosbag 的 /tf、/tf_static）：
  #       odom --(动态)--> base_footprint --(静态)--> base_link --(静态)--> laser_points_*/uwb_*
  #    而本工程原来【直接发 map→base_link】，于是 base_link 有了 map 与 base_footprint
  #    【两个父节点】⇒ TF 树冲突：RViz/Nav2 报 multiple parents，或只认一条，画面与坐标乱跳。
  #  【现在的行为】定位只补"世界系那一段"这一条边：先查车上已有的 odom→base_link
  #    （tf2 会穿过 base_footprint 自动串联），再反推并发布
  #         T_map_odom = T_map_base · (T_odom_base)⁻¹
  #    → 得到完整无冲突的链：map → odom → base_footprint → base_link → ...
  #    map→odom 就是里程计系的漂移修正量；下游以 map 为 fixed frame 查 base_link 得到的
  #    仍是定位位姿（与旧行为数值等价）。
  #  说明：全部是【可选键】，整段删掉也能跑（用代码默认值 = 下面的取值）。
  tf:
    enable: true                  # 总开关；false => 不发 TF、也不建 tf2 监听
    mode: "map_odom"              # map_odom(默认) = 发 map→odom（需要车上已有 odom→base_link）
                                  # map_base        = 老行为，直接发 map→base_link
                                  #                   （⚠ base_link 会有两个父节点，仅为兼容保留）
    map_frame_id: "map"           # 地图帧名（发布出去的父帧）。正常情况下定位结果自带 frame_id="map"，
                                  #   以结果里的为准；本项只在结果帧名为空时兜底
    odom_frame_id: "odom"         # 里程计帧名（必须与车上 TF 一致；发布出去的子帧）
    base_frame_id: "base_link"    # 车体帧名（查 odom→base_link 的目标帧；
                                  #   仅在定位结果的 child_frame_id 为空时用它兜底）
    lookup_timeout: 0.0           # 查 odom→base_link 的最长等待(秒)。默认 0 = 只查缓存不等待：
                                  #   该回调跑在定位工作线程里，等太久会拖慢定位输出；
                                  #   车上 TF 连续发布，稳态下 tf2 直接插值命中，无需等待。
                                  #   若日志频繁出现"查不到 odom→base_link"，可试 0.02~0.05

  enable_lidar_loc_skip: true   # 定位端点云跳帧（降低负载）
  enable_lidar_loc_rviz: false  # 是否发布定位 RViz 可视化
  enable_lidar_odom_skip: false # 里程计端点云跳帧
  lidar_loc_skip_num: 2         # 定位端：每 N 帧取一帧（lidar_slam Airy 实测取值）
  lidar_odom_skip_num: 3        # 里程计端：每 N 帧取一帧

  map_path: ./data/new_map/     # ★定位端读取的地图目录；必须与建图保存目录一致
                                #   建图端（run_slam_online 响应 /lightning/save_map，或 run_slam_offline 退出时）
                                #   实际写到 "./data/<地图名>/"（slam.cc:140 与 slam.cc:149），
                                #   相对路径依赖【进程启动目录】，建议改为绝对路径以免与地图目录不一致
                                #   （lidar_slam 上就是用的绝对路径 /home/.../data/new_map/）
                                #   ★地图里的 `index.txt` 带一行为 `start <T_map_lidar>` 的功能点，
                                #   在线/离线定位的默认初值就是它（`lidar_loc.cc` InitWithFP），
                                #   所以定位请从【地图起点附近】开始，或显式给 `--init_pose`（见下）。
                                #   在线入口 `run_loc_online` 自 2026-10-01 起不再注入单位阵初值
                                #   （旧行为会把车摆到地图原点 → 定位完全不可用，见报告第 11 章）；
                                #   如需外部初值：`--init_pose "x,y,z,qx,qy,qz,qw"`
                                #   语义是 **T_map_lidar**（含 雷达→IMU 外参），不是车辆位姿。

# -----------------------------------------------------------------------------
#  loop_closing：回环检测
#  读取位置：loop_closing.cc:48-53
#  注：lidar_slam 里额外的 motion_*_noise / loop_*_noise / rk_loop_th / icp_fitness_th /
#      min_overlap / nn_median_th / log_weight 等，本工程代码尚未读取（默认值写在
#      loop_closing.h），写入本文件不会生效，故未列出。
# -----------------------------------------------------------------------------
loop_closing:
  loop_kf_gap: 20               # 每隔多少个关键帧检查一次
  min_id_interval: 20           # 被检查的关键帧 ID 间隔
  closest_id_th: 50             # 历史关键帧与当前帧的 ID 间隔下限
  max_range: 30.0               # 候选帧最大距离(m)（lidar_slam Airy 实测；默认配置为 20.0）
  ndt_score_th: 1.0             # NDT 位姿分值阈值
  with_height: true             # 是否使用高度约束（定位端 lidar_loc 的实现也会读这一项）

# -----------------------------------------------------------------------------
#  lidar_loc：激光定位（NDT 地图匹配）
#  读取位置：localization.cpp:41-42,69,110-118 与 lidar_loc.cc:30-99
#  注：lidar_loc.filter_z_min/max、filter_intensity_min/max 在 lidar_loc.cc 中已被注释掉
#      （不生效）；mask_roll_pitch / mask_z / update_err_* 等是
#      lidar_slam 的新增项，本工程代码尚未读取，故未写入。
#      ★recover_pose_path 这个 yaml 键本工程**不读**，但"恢复位姿"机制是**生效**的：
#      路径硬编码为 `lidar_loc.h:65` 的 `./data/recover_pose.txt`（同样相对【进程启动目录】），
#      每帧定位结果都会写入该文件（`lidar_loc.cc:782`），启动时若文件存在就把它作为一个
#      名为 `recover` 的功能点加入初始化候选（`lidar_loc.cc:112`）。
#      因此它是**排在 `start` 之后的第二个初始化候选**：`start` 达标即不再尝试它；
#      但若上一次运行跑飞/失锁，该文件里就是一个错误位姿——修复前的"初始化门槛失效"
#      会让它被无条件接受，请勿手工填写该文件。
# -----------------------------------------------------------------------------
lidar_loc:
  enable_parking_static: true   # 静止时更新静态地图
  enable_icp_adjust: false      # 逐帧 ICP 微调（关闭以降低资源占用）
  force_2d: false               # 是否强制 2D 匹配
  grid_search_angle_range: 180.0  # 角度网格搜索范围(度)
  grid_search_angle_step: 60      # 角度网格搜索步数

  # ---------------------------------------------------------------------------
  #  个人修改（2026-10-01）：【手动初始位姿】配套参数（见 common.initial_pose_topic）
  #  手动点选（RViz 2D Pose Estimate / 外部话题）的位姿天然带"点击延迟"误差：
  #    · 车在动时，用户点下的位置是"他看到的现在"，而定位正在配准的那一帧点云更旧/更新
  #      约 0.5~2 s ⇒ 种子约偏 0.5~2 m（车速 1 m/s 时）；
  #    · 拖出来的车头方向也可能有十几度误差。
  #  细分辨率 NDT 只有 4 次迭代、收敛半径小，种子偏 1 m 以上时分值常掉到 1.4~1.8 而被
  #  min_init_confidence(1.8) 拒掉（表现为"点了但定位不响应"）。
  #  因此【仅对手动种子】增加一步兜底：第一轮细配准被拒后，用粗分辨率(5m) NDT 在下面
  #  给的 yaw 范围内搜一遍（粗分辨率代价函数更平滑、收敛半径更大），把种子拉正后再做细配准；
  #  最终仍由同一个 min_init_confidence 门槛把关，不会放宽安全线。
  #  ★若发现误锁定（点了却锁到别处），把 manual_init_rough_search 设为 false 即可退回
  #    "只信用户给的种子"的严格行为。
  #  读取位置：lidar_loc.cc Init()（三个键都是可选项，缺键时用代码默认值，旧 yaml 也能跑）
  # ---------------------------------------------------------------------------
  manual_init_rough_search: true   # 手动种子是否启用"粗分辨率 + 小范围 yaw 搜索"兜底
  manual_init_yaw_search_deg: 30.0 # yaw 搜索范围(度，种子左右各)
  manual_init_yaw_search_step: 7   # yaw 搜索采样数（7 ⇒ 步长 10°）
  manual_init_refine_iter: 2       # 接受后再迭代精修次数（消除"附近的局部最优"，见 lidar_loc.cc InitWithFP）
  lidar_loc_odom_th: 0.5        # 定位结果与里程计结果差异阈值
  init_with_fp: true            # 使用地图功能点初始化
  min_init_confidence: 1.8      # 初始化最小置信度（lidar_slam Airy 实测；默认 0.8）
                                #   ★自 2026-10-01 起**真正生效**（报告第 11 章）：初始化候选
                                #   （外部初值 / 功能点 `start` / 恢复位姿 `recover`）的
                                #   fitness_score 必须 > 本值才会被接受，否则打印
                                #   `init confidence too low: X <= 1.8, reject this init candidate`
                                #   并继续尝试下一个候选；**跟踪阶段不受本阈值约束**。
                                #   调小它 = 允许更差的初始匹配（更容易初始化成功，也更易被
                                #   错误初值带偏）；调大它 = 更保守。
  update_dynamic_cloud: false   # 是否用定位点云更新动态图层
  update_kf_dis: 2.0            # 更新地图的关键帧距离(m)
  update_lidar_loc_score: 1.5   # 允许更新地图的匹配分值上限
  loc_on_kf: false               # true=仅在关键帧做地图匹配（省算力）；false=每帧匹配
  try_self_extrap: false        # 匹配失败时是否自外推

  # ---------------------------------------------------------------------------
  #  个人修改（2026-10-02，方案C：z 漂移根治）—— 高度约束 + 地图地面健康度自检
  #  读取位置：lidar_loc.cc Init()（全部为【可选键】，缺键时用代码默认值，旧 yaml 也能跑）
  #
  #  【为什么需要】定位端唯一的绝对观测就是点云匹配，匹配的 z 完全由地图决定。
  #   地图一旦倾斜（建图时世界系没与重力对齐；本平台实测地图地面在路径区 3.7 m 内
  #   下降 1.12 m ≈ 22°），匹配会忠实跟随这张倾斜地图 ⇒ 定位 z 沿路径持续漂移，
  #   定位端【无法靠匹配修好】，只能：把 z 约束住 + 启动时把地图不水平这件事喊出来。
  #
  #  【height_constraint 语义】z += gain · clamp(map_height − z, ±tol)
  #     tol = 0    ⇒ 完全锁定 z 到 map_height（= 原代码里被注释掉的 with_height_ 逻辑的行为）
  #     tol > 0    ⇒ "软皮带"：只把偏离超过 ±tol 的部分拉回来（默认 0.3 m）
  #     gain = 0   / enable=false ⇒ 关闭（等价于本次修改之前的行为）
  #   ★路线含长坡道/匝道时，tol 建议给 0.5~1.0 或直接关掉，否则坡道段 z 会被夹住。
  #   ★地图重建为水平后，这一项只是"防跑飞的安全带"，正常不会生效（差异 ≈ 0）。
  #  【副作用说明】开启后 LO/DR 只提供平面内(x/y/yaw)递推，不再把 z 变化注入预测初值
  #   （与原注释代码一致），可避免倾斜的 LIO 带着定位一起往下掉。
  # ---------------------------------------------------------------------------
  height_constraint_enable: true   # 总开关（不写时回退到 loop_closing.with_height）
  height_constraint_gain: 1.0      # 修正增益 0~1
  height_constraint_tol: 0.3       # 软皮带半宽(m)；0 = 完全锁定

  map_level_check_enable: true     # 启动时自检"地图地面是否水平"（强烈建议保持开启）
  map_level_warn_deg: 2.0          # 地面倾角超过该值即打 ERROR：地图倾斜、z 必然漂移、需重建
  map_level_radius: 25.0           # 自检统计半径(m)：以 index.txt 的 start 功能点为中心

  force_2d_zero_z: false           # force_2d=true 时是否也把 z 归零（原行为，默认只约束 roll/pitch）
                                   #   原实现是 z=0（"地图原点在地面"的 2D 导航假设）；本平台地图
                                   #   原点在 IMU 处、地面在 z≈-0.68 m，z 归零会让定位整体偏低

# -----------------------------------------------------------------------------
#  maps：地图分块与动态图层策略
#  读取位置：lidar_loc.cc:60-99
# -----------------------------------------------------------------------------
maps:
  delete_when_unload: false     # 卸载分块时是否删除数据
  dyn_cloud_policy: persistent  # 动态图层策略：short / long / persistent
  load_dyn_cloud: true          # 是否加载动态图层
  load_map_size: 2              # 加载分块数量
  max_pts_dyn_chunk: 100000     # 动态分块最大点数
  save_dyn_when_quit: true      # 退出时保存动态图层
  save_dyn_when_unload: false   # 卸载时保存动态图层
  unload_map_size: 4            # 卸载分块数量
  with_dyn_area: false          # 是否启用动态多边形区域

